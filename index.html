<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">

<title>My First Islam</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{
--green:#075331;
--dark:#043b24;
--gold:#d5ad43;
--cream:#f8f3e4;
--bg:#f3f7f5;
--white:#ffffff;
--text:#24342c;
--muted:#6d7b74;
--border:#dfe8e2;
--shadow:0 7px 25px rgba(0,0,0,.08);
}

body{
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--text);
line-height:1.65;
padding-bottom:70px;
}

button{
font-family:inherit;
}

header{
background:linear-gradient(135deg,var(--dark),var(--green));
color:white;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 3px 18px rgba(0,0,0,.18);
}

.header{
height:68px;
max-width:1100px;
margin:auto;
padding:0 20px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:21px;
font-weight:bold;
}

.logo span{
color:#f0cf62;
}

.menu{
font-size:24px;
border:0;
background:rgba(255,255,255,.1);
color:white;
width:42px;
height:42px;
border-radius:9px;
cursor:pointer;
}

.desktop{
display:none;
gap:3px;
}

.desktop button{
border:0;
background:transparent;
color:white;
padding:9px 11px;
border-radius:8px;
cursor:pointer;
}

.desktop button:hover{
background:rgba(255,255,255,.12);
}

.mobile-menu{
display:none;
padding:8px 20px 15px;
background:var(--dark);
}

.mobile-menu.open{
display:block;
}

.mobile-menu button{
display:block;
width:100%;
border:0;
background:rgba(255,255,255,.08);
color:white;
padding:12px;
margin:5px 0;
border-radius:8px;
text-align:left;
cursor:pointer;
}

main{
max-width:1100px;
margin:auto;
padding:20px;
}

.page{
display:none;
}

.page.active{
display:block;
}

.hero{
background:linear-gradient(135deg,var(--dark),var(--green));
color:white;
padding:48px 22px;
border-radius:23px;
text-align:center;
box-shadow:var(--shadow);
margin-bottom:20px;
}

.moon{
font-size:55px;
}

.hero h1{
font-size:38px;
margin:5px 0;
}

.hero h2{
font-size:18px;
font-weight:normal;
color:#e2eee8;
margin-bottom:18px;
}

.hero p{
max-width:650px;
margin:auto auto 22px;
color:#dbeae3;
}

.primary{
background:var(--gold);
border:0;
color:#18241d;
font-weight:bold;
padding:13px 22px;
border-radius:10px;
cursor:pointer;
}

.primary:hover{
opacity:.9;
}

.install-btn{
background:var(--gold);
border:2px solid rgba(255,255,255,.35);
color:#18241d;
font-weight:bold;
padding:13px 22px;
border-radius:10px;
cursor:pointer;
margin:12px 5px 0;
box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.install-btn:hover{
opacity:.9;
transform:translateY(-2px);
}

.lang{
display:flex;
justify-content:center;
gap:8px;
margin:16px 0 25px;
}

.lang button{
border:1px solid var(--border);
background:white;
color:var(--green);
padding:8px 16px;
border-radius:22px;
cursor:pointer;
}

.lang button.active{
background:var(--green);
color:white;
}

.heading{
text-align:center;
margin:25px 0 17px;
}

.heading h2{
color:var(--green);
}

.heading p{
color:var(--muted);
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
gap:16px;
}

.card{
background:white;
border:1px solid var(--border);
padding:22px;
border-radius:16px;
box-shadow:var(--shadow);
cursor:pointer;
transition:.2s;
}

.card:hover{
transform:translateY(-3px);
}

.icon{
font-size:34px;
margin-bottom:7px;
}

.card h3{
color:var(--green);
}

.card p{
color:var(--muted);
font-size:14px;
}

.lesson{
background:white;
border:1px solid var(--border);
border-radius:18px;
padding:27px;
box-shadow:var(--shadow);
margin-bottom:20px;
}

.lesson h1,
.lesson h2{
color:var(--green);
margin-bottom:15px;
}

.lesson h3{
color:var(--dark);
margin:22px 0 9px;
}

.lesson p{
margin-bottom:12px;
}

.back{
border:0;
background:#e6efe9;
color:var(--green);
font-weight:bold;
padding:10px 16px;
border-radius:9px;
cursor:pointer;
margin-bottom:16px;
}

.badge{
display:inline-block;
background:#edf5ef;
color:var(--green);
padding:5px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold;
margin-bottom:9px;
}

.info{
background:#f4f8f5;
border-left:4px solid var(--green);
padding:15px;
border-radius:6px;
margin:15px 0;
}

.warning{
background:#fff8e5;
border-left:4px solid var(--gold);
padding:15px;
border-radius:6px;
margin:15px 0;
}

.arabic{
direction:rtl;
text-align:center;
font-family:"Times New Roman",serif;
font-size:30px;
line-height:2.1;
background:var(--cream);
padding:18px 10px;
border-radius:12px;
margin:14px 0;
}

.translit{
background:#f4f7f5;
padding:13px;
border-radius:9px;
margin:9px 0;
font-style:italic;
}

.meaning{
background:#fafafa;
border:1px solid var(--border);
padding:13px;
border-radius:9px;
margin:9px 0;
}

.urdu{
direction:rtl;
text-align:right;
font-size:18px;
}

.step{
display:flex;
gap:13px;
background:#fffdf5;
border:1px solid #eee5c8;
padding:15px;
border-radius:11px;
margin:11px 0;
}

.num{
min-width:34px;
height:34px;
border-radius:50%;
background:var(--green);
color:white;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.step strong{
color:var(--green);
}

.prayer-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:12px;
margin:15px 0;
}

.prayer{
background:#f5f8f6;
border:1px solid var(--border);
border-radius:12px;
padding:15px;
text-align:center;
}

.prayer strong{
display:block;
color:var(--green);
font-size:18px;
}

.progress{
height:9px;
background:#e5ebe7;
